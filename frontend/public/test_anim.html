<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background: #f7f7f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    gap: 30px;
    padding: 60px;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: white;
    padding: 24px 20px;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    text-align: center;
    width: 140px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  .icon-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 52px;
    margin-bottom: 12px;
    transition: transform 0.2s ease-out;
  }
  .card:hover .icon-wrap {
    transform: scale(1.12);
  }
  img {
    height: 38px;
    width: auto;
    object-fit: contain;
  }

  /* Earth / Globe Rotation: spins horizontally like Earth rotates */
  @keyframes earthRotateLikeGlobe {
    0% { transform: perspective(600px) rotateY(0deg); }
    100% { transform: perspective(600px) rotateY(-360deg); }
  }
  .anim-earth {
    animation: earthRotateLikeGlobe 2.5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
  }

  /* House Playful Shake Animation */
  @keyframes housePlayfulShake {
    0% { transform: translateY(0) rotate(0deg) scale(1); }
    15% { transform: translateY(-2px) rotate(-7deg) scale(1.06); }
    30% { transform: translateY(-3px) rotate(7deg) scale(1.08); }
    45% { transform: translateY(-2px) rotate(-5deg) scale(1.06); }
    60% { transform: translateY(-1px) rotate(4deg) scale(1.04); }
    75% { transform: translateY(0) rotate(-2deg) scale(1.02); }
    90% { transform: translateY(0) rotate(1deg) scale(1.01); }
    100% { transform: translateY(0) rotate(0deg) scale(1); }
  }
  .anim-house {
    animation: housePlayfulShake 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    transform-origin: center bottom;
  }

  /* Parachute Smooth Jump */
  @keyframes parachuteJump {
    0% { transform: translateY(0) scale(1); }
    25% { transform: translateY(-12px) scale(1.08) rotate(3deg); }
    50% { transform: translateY(-16px) scale(1.1) rotate(-2deg); }
    75% { transform: translateY(-5px) scale(1.03) rotate(1deg); }
    100% { transform: translateY(0) scale(1) rotate(0deg); }
  }
  .anim-parachute {
    animation: parachuteJump 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    transform-origin: center bottom;
  }

  /* Bell Ringing Shake */
  @keyframes bellRing {
    0% { transform: rotate(0deg); }
    15% { transform: rotate(14deg); }
    30% { transform: rotate(-14deg); }
    45% { transform: rotate(10deg); }
    60% { transform: rotate(-8deg); }
    75% { transform: rotate(4deg); }
    90% { transform: rotate(-2deg); }
    100% { transform: rotate(0deg); }
  }
  .anim-bell {
    animation: bellRing 1.5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    transform-origin: center bottom;
  }

  p {
    font-size: 14px;
    font-weight: 600;
    color: #222222;
    margin: 0;
  }
  span {
    font-size: 11px;
    color: #717171;
    display: block;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap anim-earth">
      <img src="http://localhost:3000/icons/tab-all.png">
    </div>
    <p>All</p>
    <span>Earth rotates</span>
  </div>

  <div class="card">
    <div class="icon-wrap anim-house">
      <img src="http://localhost:3000/icons/tab-homes.png">
    </div>
    <p>Homes</p>
    <span>House shakes</span>
  </div>

  <div class="card">
    <div class="icon-wrap anim-parachute">
      <img src="http://localhost:3000/icons/tab-experiences.png">
    </div>
    <p>Experiences</p>
    <span>Smooth jump</span>
  </div>

  <div class="card">
    <div class="icon-wrap anim-bell">
      <img src="http://localhost:3000/icons/tab-services.png">
    </div>
    <p>Services</p>
    <span>Bell rings</span>
  </div>
</body>
</html>
